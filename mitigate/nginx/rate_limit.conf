# rate_limit.conf — application-layer flood mitigation for nginx.
#
# Defends against the hardest DoS layer to filter at the network level:
# requests that look entirely legitimate individually but are sent at a
# rate (or hit an expensive endpoint) designed to exhaust backend capacity.
#
# Place the `limit_req_zone` / `limit_conn_zone` directives in the `http {}`
# block (e.g. /etc/nginx/conf.d/rate_limit.conf, included from nginx.conf),
# then reference the zones inside your `server {}` / `location {}` blocks.

# --- Zones (define once, in http{} context) ---------------------------------

# General request-rate limit: 10 requests/sec per client IP, tracked in a
# 10MB shared memory zone (~160k tracked IPs).
limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=10r/s;

# Stricter limit for expensive endpoints (search, login, password reset,
# anything that triggers a DB query or heavy compute) — adjust the location
# match below to your actual routes.
limit_req_zone $binary_remote_addr zone=req_expensive:10m rate=2r/s;

# Cap simultaneous open connections per client IP (helps against
# Slowloris-style connection hoarding at the proxy layer too).
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# --- Apply inside your server{} block ---------------------------------------
#
# server {
#     limit_req zone=req_per_ip burst=20 nodelay;
#     limit_conn conn_per_ip 20;
#
#     # Return 429 instead of nginx's default 503 so monitoring/logs can
#     # distinguish "we rate-limited this" from "we're actually down".
#     limit_req_status 429;
#     limit_conn_status 429;
#
#     location /search {
#         limit_req zone=req_expensive burst=5 nodelay;
#         proxy_pass http://backend;
#     }
#
#     location /login {
#         limit_req zone=req_expensive burst=5 nodelay;
#         proxy_pass http://backend;
#     }
# }

# --- Logging ------------------------------------------------------------
# Rate-limit rejections are logged to the normal error log at `warn` level
# by default. To get them in a dedicated file for the detection scripts /
# fail2ban to consume:
#
#   error_log /var/log/nginx/rate_limit.log warn;

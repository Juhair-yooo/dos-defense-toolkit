# slowloris_timeouts.conf — timeout hardening against slow-HTTP attacks.
#
# Slowloris works by trickling request headers/body slowly enough to avoid
# a read timeout while holding a worker connection open. nginx's default
# timeouts are already far more conservative than Apache's historically
# were, but tightening them further costs nothing for real clients (a
# normal browser sends headers in milliseconds) and closes the gap the
# attack relies on.
#
# Place in http{} or server{} context.

# Max time to receive the client request headers. A real client sends
# these essentially instantly; 10s is generous.
client_header_timeout 10s;

# Max time to receive the client request body (relevant for slow POST
# variants of the attack).
client_body_timeout 10s;

# Max time to send a response to the client before closing the connection.
send_timeout 10s;

# How long to keep an idle keep-alive connection open. Lower than the
# nginx default (75s) to free worker slots faster; raise if you have
# legitimate long-poll/keep-alive-heavy clients.
keepalive_timeout 30s;

# Reject requests with excessively large headers (another slow/resource
# -exhaustion vector: huge header sets instead of slow ones).
large_client_header_buffers 4 8k;

# Limit request body size to something sane for your app — prevents a
# single slow, huge upload from tying up a worker for a long time.
client_max_body_size 10m;

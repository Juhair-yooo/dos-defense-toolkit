# dos-generic.conf — fail2ban filter for application-layer flood signatures.
#
# Matches nginx access-log lines where a client was rejected by the
# limit_req/limit_conn zones configured in mitigate/nginx/rate_limit.conf
# (status 429), plus repeated 499/408 (client gave up / request timeout —
# common in slow-HTTP patterns).
#
# Assumes the default nginx combined log format. Adjust $logpath in the
# matching jail if you customized `log_format`.

[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE) .*" 429
            ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE) .*" 408

ignoreregex =

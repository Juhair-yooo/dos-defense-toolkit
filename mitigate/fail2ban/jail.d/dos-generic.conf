# dos-generic.conf (jail) — bans sources that repeatedly trip nginx's
# rate limiting or leave requests hanging (slow-HTTP signature).
#
# Tune findtime/maxretry/bantime to your traffic. Defaults here: 10
# matching log lines within 2 minutes earns a 1-hour ban.

[dos-generic]
enabled  = true
filter   = dos-generic
logpath  = /var/log/nginx/access.log
port     = http,https
findtime = 120
maxretry = 10
bantime  = 3600
action   = %(action_)s
